<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>自动发货 - 获取手机号</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #e8f0fe 0%, #fde8f0 50%, #e2f0ff 100%);
            --card-bg: rgba(255, 255, 255, 0.65);
            --card-border: 1px solid rgba(255, 255, 255, 0.8);
            --card-shadow: 0 8px 32px rgba(0, 0, 0, 0.06), 0 2px 8px rgba(0, 0, 0, 0.02);
            --primary: #007AFF;
            --primary-hover: #0066D9;
            --danger: #FF3B30;
            --success: #34C759;
            --warning: #FF9500;
            --text-primary: #1C1C1E;
            --text-tertiary: #8E8E93;
            --separator: rgba(229, 229, 234, 0.6);
            --input-bg: rgba(242, 242, 247, 0.7);
            --radius: 24px;
            --radius-sm: 16px;
            --radius-xs: 12px;
            --font: -apple-system, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font);
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            -webkit-font-smoothing: antialiased;
        }

        .hidden { display: none !important; }

        .container {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: var(--card-border);
            border-radius: var(--radius);
            box-shadow: var(--card-shadow);
            padding: 32px 24px;
            text-align: center;
            transition: box-shadow var(--transition);
        }

        .header { margin-bottom: 24px; }
        .header .logo {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .header .logo .emoji { font-size: 32px; }
        .header .subtitle { color: var(--text-tertiary); font-size: 15px; margin-top: 4px; font-weight: 400; }
        .header .order-id { font-size: 13px; color: var(--text-quaternary); margin-top: 6px; font-weight: 400; letter-spacing: 0.5px; }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 14px 20px;
            border: none;
            border-radius: 999px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition);
            font-family: var(--font);
            letter-spacing: 0.3px;
            min-height: 50px;
            white-space: normal;
            line-height: 1.3;
        }
        .btn:active { transform: scale(0.96); }
        .btn-primary {
            background: linear-gradient(135deg, var(--primary), #0056b3);
            color: #fff;
            box-shadow: 0 4px 15px rgba(0, 122, 255, 0.3);
        }
        .btn-primary:hover { background: linear-gradient(135deg, var(--primary-hover), #004a99); box-shadow: 0 6px 20px rgba(0, 122, 255, 0.4); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }

        .btn-secondary {
            background: var(--input-bg);
            color: var(--primary);
            border: 1px solid var(--separator);
            box-shadow: none;
        }
        .btn-secondary:hover { background: #E8E8ED; }
        .btn-secondary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .btn-copy {
            background: transparent;
            border: 1px dashed rgba(0, 122, 255, 0.4);
            color: var(--primary);
            padding: 10px 20px;
            border-radius: 999px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition);
            font-family: var(--font);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 10px;
        }
        .btn-copy:hover { border-color: var(--primary); background: rgba(0, 122, 255, 0.04); }

        .info-card {
            background: rgba(255, 255, 255, 0.5);
            border-radius: var(--radius-sm);
            padding: 20px 16px;
            margin: 16px 0;
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.01);
        }
        .info-card .label { color: var(--text-tertiary); font-size: 13px; font-weight: 500; margin-bottom: 8px; }
        .phone-number { font-size: 28px; font-weight: 600; letter-spacing: 2px; color: var(--text-primary); user-select: all; }

        .status-text {
            font-weight: 500;
            padding: 14px 16px;
            border-radius: var(--radius-sm);
            margin: 12px 0 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 15px;
            line-height: 1.5;
            backdrop-filter: blur(10px);
        }
        .status-info { background: rgba(0, 122, 255, 0.08); border: 1px solid rgba(0, 122, 255, 0.15); color: var(--primary); }
        .status-success { background: rgba(52, 199, 89, 0.1); border: 1px solid rgba(52, 199, 89, 0.2); color: #1D8B3C; }
        .status-warning { background: rgba(255, 149, 0, 0.1); border: 1px solid rgba(255, 149, 0, 0.2); color: #B25900; }
        .status-error { background: rgba(255, 59, 48, 0.1); border: 1px solid rgba(255, 59, 48, 0.2); color: var(--danger); }

        .countdown { font-size: 18px; font-weight: 600; color: var(--warning); margin-top: 8px; }
        .polling-indicator { display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--text-tertiary); font-size: 14px; margin-top: 16px; }
        .polling-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--primary); animation: pulse 1.5s ease-in-out infinite; }
        @keyframes pulse { 0%, 100% { opacity: 0.3; transform: scale(1); } 50% { opacity: 1; transform: scale(1.2); } }
        .poll-count { font-size: 12px; color: var(--text-quaternary); margin-left: 4px; }

        .locked-banner, .done-banner {
            background: rgba(255, 255, 255, 0.5);
            border-radius: var(--radius-sm);
            padding: 28px 20px;
            margin: 16px 0;
            border: 1px solid rgba(255, 255, 255, 0.9);
        }
        .locked-banner .icon, .done-banner .icon { font-size: 44px; display: block; margin-bottom: 12px; }
        .locked-banner .title { font-size: 20px; font-weight: 700; color: var(--danger); }
        .done-banner .title { font-size: 20px; font-weight: 700; color: var(--success); }
        .locked-banner .desc, .done-banner .desc { color: var(--text-secondary); font-size: 14px; margin-top: 6px; }

        .text-tertiary { color: var(--text-tertiary); font-size: 14px; }
        .text-quaternary { color: var(--text-quaternary); font-size: 13px; }

        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.92) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .compact-card {
            background: rgba(255, 255, 255, 0.55);
            border-radius: var(--radius-sm);
            padding: 14px 12px;
            margin: 12px 0;
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.01);
        }
        .compact-row { display: flex; gap: 10px; }
        .compact-col {
            flex: 1; min-width: 0; background: rgba(242, 242, 247, 0.75);
            border-radius: var(--radius-xs); padding: 10px 8px; text-align: center;
        }
        .compact-col .label { color: var(--text-tertiary); font-size: 12px; font-weight: 500; margin-bottom: 4px; }
        .compact-phone { font-size: 16px; font-weight: 700; letter-spacing: 0.5px; color: var(--text-primary); user-select: all; word-break: break-all; }
        .compact-code {
            font-size: 20px; font-weight: 700; letter-spacing: 2px; color: var(--primary);
            user-select: all; font-family: 'SF Mono', 'Consolas', monospace; word-break: break-all;
        }
        .compact-copy-row { display: flex; gap: 8px; margin-top: 10px; }
        .compact-copy-row .btn-copy { flex: 1; margin-top: 0; justify-content: center; padding: 8px 10px; font-size: 13px; }

        .code-overlay {
            position: fixed; inset: 0; background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            z-index: 1100; display: flex; align-items: center; justify-content: center;
            padding: 20px 16px; overflow-y: auto;
        }
        .code-modal {
            width: 100%; max-width: 400px; max-height: 90vh; overflow-y: auto;
            background: #fff; border-radius: var(--radius); box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
            padding: 26px 18px 22px; text-align: center; animation: modalIn 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .code-modal::-webkit-scrollbar { width: 4px; }
        .code-modal::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 4px; }

        .code-modal-icon { font-size: 42px; line-height: 1; margin-bottom: 6px; }
        .code-modal-title { font-size: 21px; font-weight: 700; color: var(--text-primary); letter-spacing: -0.3px; }
        .code-modal-sub { font-size: 13px; color: var(--text-tertiary); margin-top: 4px; margin-bottom: 18px; }

        .cm-grid { display: flex; gap: 10px; margin-bottom: 16px; }
        .cm-box {
            flex: 1; min-width: 0; background: rgba(242, 242, 247, 0.9);
            border-radius: var(--radius-xs); padding: 12px 8px; border: 1px solid rgba(0, 0, 0, 0.04);
        }
        .cm-label { font-size: 12px; color: var(--text-tertiary); font-weight: 500; margin-bottom: 6px; }
        .cm-value {
            font-size: 17px; font-weight: 700; color: var(--text-primary);
            letter-spacing: 0.5px; user-select: all; word-break: break-all; margin-bottom: 9px; line-height: 1.3;
        }
        .cm-value.cm-code-val {
            color: var(--primary); font-family: 'SF Mono', 'Consolas', monospace;
            font-size: 22px; letter-spacing: 2px;
        }
        .cm-copy-btn {
            width: 100%; border: none; border-radius: 999px; background: var(--primary); color: #fff;
            font-size: 12.5px; font-weight: 600; padding: 8px 6px; cursor: pointer; font-family: var(--font); transition: all var(--transition);
        }
        .cm-copy-btn:hover { background: var(--primary-hover); }
        .cm-copy-btn:active { transform: scale(0.96); }
        .cm-copy-btn.copied { background: var(--success); }

        .code-warning {
            background: rgba(255, 59, 48, 0.08); border: 1.5px solid rgba(255, 59, 48, 0.3);
            border-radius: var(--radius-xs); padding: 13px 14px; font-size: 13.5px;
            font-weight: 700; color: var(--danger); line-height: 1.65; text-align: center; margin-bottom: 16px;
        }
        .code-warning .cw-icon { display: block; font-size: 18px; margin-bottom: 4px; }

        .custom-notice-box {
            margin-bottom: 16px;
            padding: 14px 16px;
            background: linear-gradient(135deg, rgba(255, 149, 0, 0.1), rgba(255, 149, 0, 0.05));
            border: 1.5px solid rgba(255, 149, 0, 0.3);
            border-radius: var(--radius-sm);
            text-align: left;
            font-size: 14px;
            color: #B25900;
            font-weight: 600;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
            position: relative;
        }
        .custom-notice-box::before {
            content: "📢";
            position: absolute;
            top: -10px;
            left: 12px;
            background: #fff;
            padding: 0 4px;
            font-size: 16px;
            border-radius: 4px;
        }

        .reuse-action-bar {
            display: flex; gap: 10px; align-items: center; justify-content: space-between;
            margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--separator);
        }
        .reuse-count-text { font-size: 13px; color: var(--warning); font-weight: 600; }
        .reuse-btn { 
            min-height: auto; padding: 10px 16px; font-size: 14px; border-radius: 999px; width: auto; flex: 1;
        }

        #testMockBtn {
            position: fixed; bottom: 30px; right: 30px; z-index: 9999;
            background: var(--danger); color: #fff; border: none; border-radius: 50px;
            padding: 12px 20px; font-size: 15px; font-weight: 700;
            box-shadow: 0 4px 16px rgba(255, 59, 48, 0.4); cursor: pointer;
            display: none;
        }
        #testMockBtn:active { transform: scale(0.95); }

        @media (max-width: 480px) {
            .compact-phone { font-size: 15px; }
            .compact-code { font-size: 18px; letter-spacing: 1.5px; }
            .code-modal { padding: 22px 14px 18px; max-height: 95vh; border-radius: 20px; }
            .code-modal-title { font-size: 19px; }
            .cm-value { font-size: 15px; }
            .cm-value.cm-code-val { font-size: 20px; letter-spacing: 1.5px; }
            .code-warning { font-size: 12.5px; padding: 11px 10px; }
            .custom-notice-box { font-size: 13px; padding: 12px; }
        }
    </style>
</head>
<body>

    <button id="testMockBtn" onclick="triggerMockSMS()">⚡ 模拟来短信</button>

    <div class="container" id="mainContainer">
        <div id="noOrderView">
            <div class="header">
                <div class="logo"><span class="emoji">⚡</span> 自动发货</div>
                <div class="subtitle">获取手机号与验证码</div>
            </div>
            <div class="status-text status-warning" style="margin-top: 20px;">⚠️ 请使用卖家提供的专属链接访问</div>
            <p class="text-tertiary" style="margin-top: 16px;">链接由卖家创建，每个链接仅可使用一次</p>
        </div>

        <div id="orderView" class="hidden">
            <div class="header">
                <div class="logo"><span class="emoji">📱</span> 获取验证码</div>
                <div class="order-id" id="orderIdDisplay"></div>
            </div>

            <div id="customNoticeBox" class="custom-notice-box hidden"></div>

            <div id="lockedBox" class="hidden">
                <div class="locked-banner">
                    <span class="icon">🔒</span>
                    <div class="title">此链接已失效</div>
                    <div class="desc">该订单已结束或已被管理员释放</div>
                </div>
                <button class="btn btn-secondary" onclick="location.reload()">🔄 刷新页面</button>
            </div>

            <div id="statusBox"></div>

            <div id="initBox">
                <button class="btn btn-primary" onclick="getPhone()" id="getPhoneBtn" style="font-size: 15px; padding: 15px 10px;">
                    获取手机号
                </button>
                <p class="text-tertiary" style="margin-top: 16px;">点击后获取手机号，有效期 65 秒</p>
            </div>

            <div id="phoneBox" class="hidden">
                <div class="info-card">
                    <div class="label">手机号码</div>
                    <div class="phone-number" id="phoneDisplay">---</div>
                </div>
                <button class="btn-copy" onclick="copyPhone()">复制手机号</button>

                <div style="margin-top: 16px; padding: 16px 12px; background: rgba(255, 255, 255, 0.5); border-radius: var(--radius-sm); border: 1px solid var(--separator); text-align: center;">
                    <span style="color: var(--text-primary); font-weight: 600; font-size: 15px; letter-spacing: 0.3px;">
                        复制手机号到应用获取验证码
                    </span>
                </div>

                <div style="display: none !important;">
                    <div id="countdownDisplay" class="hidden">65s</div>
                    <div class="polling-indicator" id="pollingIndicator">
                        <span class="polling-dot"></span>
                        <span>正在轮询验证码...</span>
                        <span class="poll-count" id="pollCount"></span>
                    </div>
                </div>

                <button class="btn btn-secondary" onclick="releasePhone()" id="releaseBtn" disabled style="margin-top: 20px;">
                    释放手机号，重新获取（65秒后可操作）
                </button>
            </div>

            <div id="timeoutBox" class="hidden">
                <div class="status-text status-warning">⏰ 手机号已过期（65秒未收到验证码）</div>
                <p class="text-tertiary" style="margin-top: 8px;">号码已自动释放，您可以选择继续尝试使用该号码或获取新号码</p>
                
                <button class="btn btn-primary" onclick="reuseFromTimeout()" id="reuseTimeoutBtn" style="margin-top: 16px;">
                    继续使用上一个号码
                </button>
                <button class="btn btn-secondary" onclick="getPhone()" id="getPhoneBtnTimeout" style="margin-top: 12px;">
                    获取新号码
                </button>
            </div>

            <div id="doneBox" class="hidden">
                <div class="compact-card">
                    <div class="compact-row">
                        <div class="compact-col">
                            <div class="label">手机号</div>
                            <div class="compact-phone" id="phoneDisplayDone">---</div>
                        </div>
                        <div class="compact-col">
                            <div class="label">验证码</div>
                            <div class="compact-code" id="codeDisplay">---</div>
                        </div>
                    </div>
                    <div class="compact-copy-row">
                        <button class="btn-copy" onclick="copyPhone()">📋 复制手机号</button>
                        <button class="btn-copy" onclick="copyCode()">📋 复制验证码</button>
                    </div>
                    
                    <div class="reuse-action-bar" id="reuseBarDone">
                        <span class="reuse-count-text" id="reuseCountDisplayDone">剩余次数: 3</span>
                        <button class="btn btn-secondary reuse-btn" onclick="reuseNumber()" id="reuseBtnDone">再次使用该号码</button>
                    </div>
                </div>
                <p class="text-tertiary" id="doneTip" style="margin-top: 16px; color: var(--warning); font-weight: 600;"></p>
            </div>

            <div id="errorBox" class="hidden">
                <div class="status-text status-error" id="errorMessage"></div>
                <button class="btn btn-secondary" onclick="location.reload()" style="margin-top: 16px;">🔄 重试</button>
            </div>
        </div>
    </div>

    <div class="code-overlay hidden" id="codeOverlay">
        <div class="code-modal">
            <div class="code-modal-icon">🎉</div>
            <div class="code-modal-title">验证码已收到</div>
            <div class="code-modal-sub">请立即复制以下信息</div>
            <div class="cm-grid">
                <div class="cm-box">
                    <div class="cm-label">手机号</div>
                    <div class="cm-value" id="cmPhone">---</div>
                    <button class="cm-copy-btn" onclick="copyModalPhone(this)">复制手机号</button>
                </div>
                <div class="cm-box">
                    <div class="cm-label">验证码</div>
                    <div class="cm-value cm-code-val" id="cmCode">---</div>
                    <button class="cm-copy-btn" onclick="copyModalCode(this)">复制验证码</button>
                </div>
            </div>
            <div class="code-warning">
                <span class="cw-icon">⚠️</span>
                验证码仅供本人使用，请勿分享给他人
            </div>
            <button class="btn btn-primary" onclick="closeCodeModal()">我已复制，知道了</button>
            <div class="reuse-action-bar" id="reuseBarModal">
                <span class="reuse-count-text" id="reuseCountDisplayModal">剩余次数: 3</span>
                <button class="btn btn-secondary reuse-btn" onclick="closeCodeModal(); reuseNumber();" id="reuseBtnModal">再次使用该号码</button>
            </div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            const API_BASE = '/api/order';
            const TIMEOUT_SEC = 65; // 65 秒
            const POLL_INTERVAL = 3000; // 3 秒轮询
            const MAX_RETRIES = 22; 
            const MAX_ATTEMPTS = 3; 

            let currentOid = null;
            let currentSid = '24085';
            let currentPhone = null;
            let countdownTimer = null;
            let pollingTimer = null;
            let isOrderDone = false;
            let isGettingPhone = false;
            let isOrderLocked = false;
            let isOrderExpired = false;
            let pureCode = '';
            let pollAttempts = 0;
            let hasShownCodeModal = false;
            let usedAttempts = 0; 

            const $ = id => document.getElementById(id);
            const customNoticeBox = $('customNoticeBox');
            const codeOverlay = $('codeOverlay');
            const cmPhone = $('cmPhone');
            const cmCode = $('cmCode');

            function updateTestBtnVisibility() {
                const btn = $('testMockBtn');
                if (btn && !$('orderView').classList.contains('hidden') && !$('phoneBox').classList.contains('hidden')) {
                    btn.style.display = 'block';
                } else if (btn) {
                    btn.style.display = 'none';
                }
            }

            window.triggerMockSMS = async function() {
                if (!currentOid) return alert('当前没有活动的订单');
                $('testMockBtn').textContent = '正在模拟...';
                try {
                    const res = await apiCall('mockSMS');
                    if (res.success) {
                        $('testMockBtn').textContent = '⚡ 模拟来短信';
                        checkOrder(); 
                    } else {
                        alert('模拟失败: ' + (res.error || '未知错误'));
                        $('testMockBtn').textContent = '⚡ 模拟来短信';
                    }
                } catch (e) {
                    alert('请求出错，请检查后端是否部署正确');
                    $('testMockBtn').textContent = '⚡ 模拟来短信';
                }
            };

            function updateReuseUI() {
                const remain = MAX_ATTEMPTS - usedAttempts;
                const countText = `剩余次数: ${remain}`;
                
                if($('reuseCountDisplayDone')) $('reuseCountDisplayDone').textContent = countText;
                if($('reuseCountDisplayModal')) $('reuseCountDisplayModal').textContent = countText;
                
                const isDisabled = remain <= 0;
                
                ['reuseBtnDone', 'reuseBtnModal'].forEach(id => {
                    const btn = $(id);
                    if(btn) {
                        btn.disabled = isDisabled;
                        btn.textContent = isDisabled ? '次数已用尽' : '再次使用该号码';
                    }
                });

                if (isDisabled) {
                    if($('reuseBarDone')) $('reuseBarDone').style.opacity = '0.5';
                    if($('reuseBarModal')) $('reuseBarModal').style.opacity = '0.5';
                } else {
                    if($('reuseBarDone')) $('reuseBarDone').style.opacity = '1';
                    if($('reuseBarModal')) $('reuseBarModal').style.opacity = '1';
                }
            }

            function showCodeModal(phone, code) {
                if (hasShownCodeModal) return;
                hasShownCodeModal = true;
                cmPhone.textContent = phone || currentPhone || '---';
                cmCode.textContent = code || '---';
                codeOverlay.classList.remove('hidden');
                document.body.style.overflow = 'hidden';
                updateReuseUI();
            }

            window.closeCodeModal = function() {
                codeOverlay.classList.add('hidden');
                document.body.style.overflow = '';
            };

            codeOverlay.addEventListener('click', function(e) {
                if (e.target === codeOverlay) closeCodeModal();
            });

            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && !codeOverlay.classList.contains('hidden')) closeCodeModal();
            });

            function markCopied(btn, label) {
                if (!btn) { alert('已复制'); return; }
                const orig = label || '复制';
                btn.classList.add('copied');
                btn.textContent = '已复制 ✓';
                setTimeout(function() {
                    btn.classList.remove('copied');
                    btn.textContent = orig;
                }, 1500);
            }

            function fallbackCopy(text, btn, label) {
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'fixed';
                ta.style.opacity = '0';
                document.body.appendChild(ta);
                ta.select();
                try {
                    document.execCommand('copy');
                    markCopied(btn, label);
                } catch (err) {
                    alert('复制失败，请手动复制');
                }
                document.body.removeChild(ta);
            }

            window.copyText = function(text, btn, label) {
                if (!text) return;
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(text).then(function() {
                        markCopied(btn, label);
                    }).catch(function() {
                        fallbackCopy(text, btn, label);
                    });
                } else {
                    fallbackCopy(text, btn, label);
                }
            };

            window.copyModalPhone = function(btn) {
                const phone = cmPhone.textContent.trim();
                if (!phone || phone === '---') return;
                copyText(phone, btn, '复制手机号');
            };

            window.copyModalCode = function(btn) {
                const code = cmCode.textContent.trim();
                if (!code || code === '---') return;
                copyText(code, btn, '复制验证码');
            };

            function showUI(state) {
                ['initBox', 'phoneBox', 'timeoutBox', 'doneBox', 'errorBox', 'lockedBox', 'statusBox'].forEach(id => $(id).classList.add('hidden'));
                if (state === 'locked') { $('lockedBox').classList.remove('hidden'); }
                else if (state === 'init') { $('initBox').classList.remove('hidden'); }
                else if (state === 'active') { $('phoneBox').classList.remove('hidden'); $('statusBox').classList.remove('hidden'); }
                else if (state === 'timeout') { $('timeoutBox').classList.remove('hidden'); $('statusBox').classList.remove('hidden'); }
                else if (state === 'done') { $('doneBox').classList.remove('hidden'); $('statusBox').classList.remove('hidden'); }
                else if (state === 'error') { $('errorBox').classList.remove('hidden'); $('statusBox').classList.remove('hidden'); }
                updateTestBtnVisibility();
            }

            function setStatus(msg, type) {
                const classes = { info: 'status-info', success: 'status-success', warning: 'status-warning', error: 'status-error' };
                $('statusBox').className = 'status-text ' + (classes[type] || '');
                $('statusBox').innerHTML = msg;
                $('statusBox').classList.remove('hidden');
            }

            function disableAllButtons() {
                $('getPhoneBtn').disabled = true;
                $('getPhoneBtnTimeout').disabled = true;
                $('releaseBtn').disabled = true;
                if($('reuseTimeoutBtn')) $('reuseTimeoutBtn').disabled = true;
            }

            function enableGetButtons() {
                $('getPhoneBtn').disabled = false;
                $('getPhoneBtnTimeout').disabled = false;
                if($('reuseTimeoutBtn')) $('reuseTimeoutBtn').disabled = false;
            }

            function extractNumbers(str) {
                return (str.match(/\d+/g) || []).join('');
            }

            window.copyPhone = function() {
                const phone = currentPhone || $('phoneDisplay').textContent.trim();
                if (!phone || phone === '---') return;
                copyText(phone);
            };

            window.copyCode = function() {
                const code = pureCode || extractNumbers($('codeDisplay').textContent);
                if (!code) return;
                copyText(code);
            };

            async function apiCall(action, params = {}) {
                const url = new URL(API_BASE, location.origin);
                url.searchParams.set('action', action);
                url.searchParams.set('oid', currentOid);
                url.searchParams.set('sid', currentSid);
                Object.entries(params).forEach(([k, v]) => url.searchParams.set(k, v));
                const resp = await fetch(url);
                const data = await resp.json();
                if (!resp.ok) {
                    const err = new Error(data.error || '请求失败');
                    err.status = resp.status;
                    err.data = data;
                    throw err;
                }
                return data;
            }

            function stopAllTimers() {
                if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; }
                if (pollingTimer) { clearInterval(pollingTimer); pollingTimer = null; }
                if ($('pollingIndicator')) { $('pollingIndicator').style.display = 'none'; }
            }

            function updatePollIndicator() {
                if ($('pollingIndicator')) {
                    $('pollingIndicator').style.display = 'flex';
                    $('pollCount').textContent = `(${pollAttempts} 次)`;
                }
            }

            function handleGotCode(phone, code, isFinal) {
                stopAllTimers(); 
                if (phone) {
                    currentPhone = phone;
                    $('phoneDisplayDone').textContent = phone;
                }
                pureCode = extractNumbers(code);
                $('codeDisplay').textContent = code;
                
                isOrderDone = true; 

                if (isFinal) {
                    disableAllButtons();
                    showUI('done');
                    setStatus('次数已用尽，验证码已收到', 'success');
                    $('doneTip').textContent = '🔒 次数已用尽，此订单已完成，链接永久失效。';
                    $('doneTip').style.color = 'var(--danger)';
                } else {
                    showUI('done'); 
                    setStatus('验证码已收到，可继续使用', 'success');
                    $('doneTip').textContent = '提示：您还可以继续使用该号码接码。';
                    $('doneTip').style.color = 'var(--warning)';
                }
                
                showCodeModal(phone || currentPhone, code);
            }

            function handleExpired(phone) {
                isOrderExpired = true;
                stopAllTimers();
                enableGetButtons();
                showUI('timeout');
                setStatus('手机号已过期，可重新获取', 'warning');
                if (phone) {
                    currentPhone = phone;
                }
            }

            function startPolling() {
                if (pollingTimer) { clearInterval(pollingTimer); pollingTimer = null; }
                pollAttempts = 0;
                updatePollIndicator();

                pollingTimer = setInterval(async () => {
                    if (isOrderLocked || isOrderExpired) { stopAllTimers(); return; }
                    pollAttempts++;
                    updatePollIndicator();

                    try {
                        const statusData = await apiCall('status');
                        if (statusData.status === 'expired') { handleExpired(statusData.phone); return; }
                        if (statusData.status === 'released' || statusData.status === 'invalid') {
                            isOrderLocked = true; stopAllTimers(); showUI('locked'); return;
                        }
                        if (statusData.status === 'active' && statusData.code) {
                            usedAttempts = statusData.attempts || 0;
                            updateReuseUI();
                            handleGotCode(statusData.phone, statusData.code, statusData.attempts >= MAX_ATTEMPTS); 
                            return;
                        }
                        if (statusData.status === 'active') {
                            const sms = await apiCall('getSMS');
                            if (sms.status === 'expired') { handleExpired(sms.phone); return; }
                            if (sms.code) {
                                usedAttempts = sms.attempts || 0;
                                updateReuseUI();
                                handleGotCode(statusData.phone, sms.code, sms.attempts >= MAX_ATTEMPTS); 
                                return;
                            }
                        }
                        if (pollAttempts >= MAX_RETRIES) {
                            stopAllTimers(); enableGetButtons(); showUI('timeout');
                            setStatus('验证码等待超时，请尝试重新获取', 'warning');
                        }
                    } catch (error) {
                        console.error('[轮询异常]', error);
                        if (error.status === 403 || error.status === 404 || error.message.includes('释放') || error.message.includes('失效')) {
                            isOrderLocked = true; stopAllTimers(); showUI('locked'); return;
                        }
                        setStatus('检测网络中，继续等待...', 'warning');
                    }
                }, POLL_INTERVAL);
            }

            window.getPhone = async function() {
                if (isOrderDone || isGettingPhone || isOrderLocked) return;
                if (usedAttempts >= MAX_ATTEMPTS) {
                    alert('已达到最大使用次数限制');
                    return;
                }
                
                isOrderExpired = false;
                isGettingPhone = true;
                disableAllButtons();
                showUI('active');
                $('phoneDisplay').textContent = '获取中...';
                setStatus('正在获取手机号...', 'info');

                try {
                    const data = await apiCall('getPhone');
                    
                    usedAttempts = data.attempts || 0; 
                    updateReuseUI();

                    if (data.status === 'done') {
                        handleGotCode(data.phone, data.code, true);
                        return;
                    }
                    currentPhone = data.phone;
                    $('phoneDisplay').textContent = data.phone;
                    
                    startCountdown(data.expire);
                    setStatus('手机号已获取，正在等待验证码...', 'info');
                    startPolling();

                } catch (e) {
                    if (e.status === 403 || e.status === 404 || e.message.includes('释放') || e.message.includes('失效')) {
                        isOrderLocked = true; stopAllTimers(); showUI('locked'); return;
                    }
                    enableGetButtons();
                    showUI('error');
                    $('errorMessage').textContent = '后台暂时无可使用号码，请联系商家';
                } finally {
                    isGettingPhone = false;
                }
            };

            // 超时后复用
            window.reuseFromTimeout = async function() {
                if (usedAttempts >= MAX_ATTEMPTS) {
                    alert('已达到最大使用次数限制');
                    return;
                }
                if (!currentPhone) {
                    alert('没有可用的旧号码，请获取新号码');
                    return;
                }
                reuseNumber();
            };

            window.reuseNumber = async function() {
                if (usedAttempts >= MAX_ATTEMPTS) {
                    alert('已达到最大使用次数限制');
                    return;
                }
                if (!currentPhone) {
                    alert('当前没有可用的手机号');
                    return;
                }
                
                const remain = MAX_ATTEMPTS - usedAttempts;
                if (!confirm(`确定再次使用该号码吗？\n本次将消耗 1 次机会，剩余可用次数：${remain - 1} 次。`)) {
                    return;
                }

                isOrderDone = false;
                isOrderExpired = false;
                hasShownCodeModal = false; 
                disableAllButtons();
                
                showUI('active');
                $('phoneDisplay').textContent = currentPhone;
                pureCode = '';
                $('codeDisplay').textContent = '---';
                setStatus('正在重新请求该号码...', 'info');

                try {
                    const data = await apiCall('reuse');
                    
                    usedAttempts = data.attempts || 0;
                    updateReuseUI();
                    
                    if (data.status === 'done') {
                        handleGotCode(currentPhone, data.code, true);
                        return;
                    }
                    
                    const expireTs = data.expire || (Date.now() + TIMEOUT_SEC * 1000);
                    startCountdown(expireTs);
                    setStatus('正在等待新的验证码...', 'info');
                    startPolling();
                    
                } catch (e) {
                    alert(e.message || '再次使用失败，该号码可能已被释放，请获取新号');
                    // 复用失败，重置界面到超时界面，让用户选择获取新号
                    isOrderExpired = true;
                    enableGetButtons();
                    showUI('timeout');
                }
            };

            function startCountdown(expireTs) {
                if (countdownTimer) clearInterval(countdownTimer);
                $('countdownDisplay').classList.remove('hidden');

                const update = () => {
                    if (isOrderLocked || isOrderExpired) { clearInterval(countdownTimer); return; }
                    const remain = Math.max(0, Math.ceil((expireTs - Date.now()) / 1000));
                    $('countdownDisplay').textContent = remain + 's';
                    if (remain > 0) {
                        $('releaseBtn').disabled = true;
                        $('releaseBtn').textContent = `释放手机号，重新获取（${remain}秒后可操作）`;
                    } else {
                        clearInterval(countdownTimer); countdownTimer = null;
                        $('releaseBtn').disabled = false;
                        $('releaseBtn').textContent = '释放手机号，重新获取';
                        setStatus('号码即将释放，可稍候自动换新号', 'warning');
                        checkOrder(); 
                    }
                };
                update();
                countdownTimer = setInterval(update, 1000);
            }

            window.releasePhone = async function() {
                if (isOrderDone || !currentPhone || isOrderLocked) return;
                if (!confirm('确定释放当前手机号吗？')) return;
                try {
                    await apiCall('release');
                    currentPhone = null;
                    isOrderExpired = false;
                    stopAllTimers();
                    enableGetButtons();
                    showUI('init');
                    setStatus('', 'info');
                } catch (e) {
                    alert('释放失败');
                }
            };

            async function checkOrder() {
                if (!currentOid) return;
                try {
                    const data = await apiCall('status');
                    if (data.status === 'invalid' || data.status === 'released') {
                        isOrderLocked = true; stopAllTimers(); showUI('locked'); return;
                    }
                    if (data.status === 'expired') {
                        currentPhone = data.phone; // 记录旧号码
                        usedAttempts = data.attempts || 0;
                        updateReuseUI();
                        handleExpired(data.phone);
                        return;
                    }
                    if (data.status === 'done' && data.code) {
                        usedAttempts = data.attempts || MAX_ATTEMPTS;
                        isOrderDone = true; disableAllButtons();
                        currentPhone = data.phone; $('phoneDisplayDone').textContent = data.phone;
                        pureCode = extractNumbers(data.code); $('codeDisplay').textContent = data.code;
                        showUI('done'); setStatus('验证码已收到', 'success'); 
                        $('doneTip').textContent = '🔒 次数已用尽，此订单已完成，链接永久失效。';
                        $('doneTip').style.color = 'var(--danger)';
                        updateReuseUI(); 
                        return;
                    }
                    if (data.status === 'active' && data.phone && data.code) {
                        isOrderDone = true; disableAllButtons();
                        usedAttempts = data.attempts || 1;
                        currentPhone = data.phone; 
                        $('phoneDisplayDone').textContent = data.phone;
                        pureCode = extractNumbers(data.code); 
                        $('codeDisplay').textContent = data.code;
                        showUI('done'); 
                        setStatus('验证码已收到，可继续使用', 'success'); 
                        $('doneTip').textContent = '提示：您还可以继续使用该号码接码。';
                        $('doneTip').style.color = 'var(--warning)';
                        updateReuseUI(); 
                        return;
                    }
                    if (data.status === 'active' && data.phone && data.expire && Date.now() < data.expire) {
                        isOrderDone = false; disableAllButtons();
                        usedAttempts = data.attempts || 0;
                        currentPhone = data.phone; $('phoneDisplay').textContent = data.phone;
                        startCountdown(data.expire); showUI('active');
                        setStatus('手机号已获取，正在等待验证码...', 'info');
                        startPolling(); return;
                    }
                    showUI('init'); enableGetButtons();
                } catch (e) {
                    if (e.status === 403 || e.status === 404 || e.message.includes('释放') || e.message.includes('失效')) {
                        isOrderLocked = true; stopAllTimers(); showUI('locked'); return;
                    }
                    showUI('error');
                    $('errorMessage').textContent = '后台暂时无可使用号码，请联系商家';
                }
            }

            async function loadCustomNotice() {
                try {
                    const resp = await fetch(`${API_BASE}?action=getApiConfig`);
                    const data = await resp.json();
                    if (data && data.customNotice && data.customNotice.trim() !== '') {
                        customNoticeBox.textContent = data.customNotice;
                        customNoticeBox.classList.remove('hidden');
                    }
                } catch (e) {
                    console.warn('获取公告失败', e);
                }
            }

            (function init() {
                let oid = null;
                const pathOid = location.pathname.replace(/^\/+|\/+$/g, '');
                if (/^HZ[A-Z0-9]+$/i.test(pathOid)) { oid = pathOid; }
                const params = new URLSearchParams(location.search);
                if (!oid) { oid = params.get('oid'); }
                const sid = params.get('sid');
                if (!oid) return;
                if (sid) currentSid = sid;
                currentOid = oid;
                $('orderIdDisplay').textContent = '订单号: ' + oid;
                $('noOrderView').classList.add('hidden');
                $('orderView').classList.remove('hidden');
                
                loadCustomNotice();
                updateReuseUI();
                checkOrder();
            })();
        })();
    </script>
</body>
</html>
